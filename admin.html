<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#10283f">
	<title>Admin Portal | DIACORE Dialysis Center HMS</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body data-page="admin">
	<header class="portal-header">
		<button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="portal-menu">
			<span class="hamburger-icon" aria-hidden="true"><i></i><i></i><i></i></span>
		</button>
		<a class="portal-brand" href="index.html" aria-label="DIACORE home">
			<img src="asset/logo.png" alt="">
			<span>DIACORE <small>ADMIN PORTAL</small></span>
		</a>
		<div class="portal-header-actions"><span id="portal-user"></span><button id="logout-button" class="logout-button" type="button">Logout</button></div>
	</header>
	<aside class="portal-menu" id="portal-menu" aria-label="Admin navigation">
		<div class="menu-heading"><span>ADMIN MENU</span><button id="menu-close" type="button" aria-label="Close navigation menu">×</button></div>
		<nav class="portal-nav">
			<a href="#dashboard" data-view="dashboard">Dashboard</a>
			<a href="#billing" data-view="billing">Billing</a>
			<a href="#equipment" data-view="equipment">Equipment</a>
			<a href="#profile" data-view="profile">Profile</a>
			<a href="#nurses" data-view="nurses">Nurses</a>
			<a href="#schedule" data-view="schedule">Schedule</a>
			<a href="#patients" data-view="patients">Patient</a>
			<a href="#announcements" data-view="announcements">Announcement</a>
			<a href="#reports" data-view="reports">Report</a>
			<a href="#messages" data-view="messages">Message</a>
		</nav>
		<p class="menu-footnote">DIACORE DIALYSIS CENTER HMS</p>
	</aside>
	<section id="in-center-panel" class="in-center-panel" aria-label="Dialysis Center" hidden>
		<div class="in-center-panel-heading"><span>Dialysis Center</span><button id="in-center-minimize" type="button" aria-label="Minimize Dialysis Center">−</button></div>
		<form class="in-center-form" aria-label="Dialysis Center form"></form>
	</section>
	<button id="in-center-button" class="in-center-fab" type="button" aria-expanded="false" aria-controls="in-center-panel">Dialysis Center</button>
	<main class="portal-main">
		<div class="portal-title-row"><div><p class="portal-kicker">DIACORE DIALYSIS CENTER HMS</p><h1 id="view-title">Dashboard</h1></div><span class="demo-chip">LOCAL DEMO</span></div>
		<div id="portal-content" class="portal-content" aria-live="polite"></div>
	</main>
	<footer class="portal-footer"><span>DIACORE DIALYSIS CENTER HMS</span><span>Local demo data is stored in this browser.</span></footer>
</body>
</html>
